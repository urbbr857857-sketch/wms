<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4361ee">
    <title>智能物品管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
        }
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --bg: #f0f2f5;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            background: var(--bg);
            color: #1e293b;
            height: 100vh;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 12px 16px 14px;
            flex-shrink: 0;
            z-index: 20;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-size: 20px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
        }
        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
        }
        .header-title p {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }
        .stats-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding: 0 4px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            flex: 1;
            border-radius: 14px;
            padding: 8px 4px;
            text-align: center;
        }
        .stat-item .num {
            font-size: 20px;
            font-weight: 700;
        }
        .stat-item .label {
            font-size: 10px;
            opacity: 0.9;
            margin-top: 2px;
        }
        .search-box {
            padding: 10px 16px;
            background: white;
            border-bottom: 1px solid #e9eef3;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box i {
            color: #94a3b8;
            font-size: 16px;
        }
        .search-box input {
            border: none;
            flex: 1;
            font-size: 15px;
            outline: none;
            padding: 6px 0;
            background: transparent;
        }
        .search-box input::placeholder {
            color: #b9c7d9;
        }
        .page-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .page {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            padding: 12px 16px 90px;
            -webkit-overflow-scrolling: touch;
            background: var(--bg);
            display: none;
        }
        .page.active {
            display: block;
        }
        .item-card {
            background: white;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .item-card:active {
            transform: scale(0.98);
            background: #f8fafc;
        }
        .item-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            flex-shrink: 0;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-info .name {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .item-info .name .tag {
            font-size: 10px;
            background: #e9edf5;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 400;
            color: #334155;
        }
        .item-info .desc {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-info .meta {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            color: #475569;
        }
        .item-info .meta .qty {
            font-weight: 600;
            color: #0f172a;
        }
        .item-info .meta .qty.low {
            color: #f72585;
        }
        .badge-warn {
            background: #fef3c7;
            color: #b45309;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 6px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            padding: 6px 0 calc(6px + var(--safe-bottom));
            border-top: 1px solid #e9eef3;
            z-index: 100;
            justify-content: space-around;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #94a3b8;
            background: none;
            border: none;
            padding: 4px 12px;
            cursor: pointer;
            flex: 1;
            transition: 0.2s;
        }
        .nav-item.active {
            color: var(--primary);
            font-weight: 500;
        }
        .nav-item i {
            font-size: 20px;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: white;
            z-index: 999;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
            padding-top: var(--safe-top);
            display: flex;
            flex-direction: column;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }
        .sidebar-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 28px 20px 20px;
        }
        .sidebar-header h2 {
            font-size: 18px;
        }
        .sidebar-header p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .sidebar-menu .item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            font-size: 15px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            color: #1e293b;
        }
        .sidebar-menu .item i {
            width: 22px;
            color: var(--primary);
        }
        .sidebar-menu .item:active {
            background: #f1f5f9;
        }
        .sidebar-version {
            padding: 16px 20px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
        }
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }
        .modal-mask.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            border-radius: 28px 28px 0 0;
            padding: 24px 20px calc(20px + var(--safe-bottom));
            transform: translateY(30px);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        .modal-mask.show .modal-box {
            transform: translateY(0);
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            background: #d1d9e6;
            border-radius: 4px;
            margin: 0 auto 16px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .modal-field {
            margin-bottom: 14px;
        }
        .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 4px;
        }
        .modal-field input,
        .modal-field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dbe0e8;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.15s;
        }
        .modal-field input:focus,
        .modal-field select:focus {
            border-color: var(--primary);
            background: white;
            outline: none;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-secondary {
            background: #e9edf5;
            color: #1e293b;
        }
        .btn-danger {
            background: #f72585;
            color: white;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-warning {
            background: #f8961e;
            color: white;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }
        .detail-row .label {
            color: #64748b;
        }
        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .detail-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            min-width: 70px;
        }
        /* 数量输入框组 */
        .qty-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
        .qty-input-group input {
            width: 70px;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            outline: none;
            padding: 6px 0;
        }
        .qty-input-group input::-webkit-outer-spin-button,
        .qty-input-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .qty-input-group input[type=number] {
            -moz-appearance: textfield;
        }
        .qty-input-group .qty-label {
            font-size: 13px;
            color: #64748b;
        }
        .record-item {
            background: white;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .record-item .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .record-item .info .name {
            font-weight: 600;
        }
        .record-item .info .time {
            font-size: 11px;
            color: #94a3b8;
        }
        .record-item .badge-in {
            color: #10b981;
            font-weight: 600;
        }
        .record-item .badge-out {
            color: #f72585;
            font-weight: 600;
        }
        .my-profile {
            text-align: center;
            padding: 20px 0;
        }
        .my-profile .avatar {
            font-size: 60px;
            color: var(--primary);
            background: #eef2ff;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .my-profile .name {
            font-size: 20px;
            font-weight: 700;
        }
        .my-profile .version {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }
        .my-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .my-stats .box {
            background: white;
            border-radius: 16px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }
        .my-stats .box .num {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }
        .my-stats .box .label {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .my-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .my-actions button {
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: white;
            box-shadow: var(--card-shadow);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .my-actions button i {
            color: var(--primary);
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }
        #scanner-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: #0f172a;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin: 8px 0;
        }
        #scanner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-tip {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin: 6px 0 10px;
        }
        @media (max-width: 420px) {
            .stat-item .num {
                font-size: 18px;
            }
            .item-card {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- 侧栏 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-cubes" style="margin-right:8px;"></i>智能台账</h2>
            <p>全功能版 · v3.1</p>
        </div>
        <div class="sidebar-menu">
            <div class="item" data-tab="home"><i class="fas fa-home"></i> 首页</div>
            <div class="item" data-tab="list"><i class="fas fa-list-ul"></i> 物品清单</div>
            <div class="item" data-tab="records"><i class="fas fa-exchange-alt"></i> 出入库记录</div>
            <div class="item" id="exportExcel"><i class="fas fa-file-excel"></i> 导出 Excel</div>
            <div class="item" id="clearAllData" style="color:#dc2626;"><i class="fas fa-trash-alt" style="color:#dc2626;"></i> 清空数据</div>
        </div>
        <div class="sidebar-version">数据本地存储，无服务器</div>
    </div>

    <!-- 主头 -->
    <div class="app-header">
        <div class="header-top">
            <div class="header-left">
                <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="header-title">
                    <h1>智能物品管理</h1>
                    <p>车间物资台账系统</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="scanBtn"><i class="fas fa-qrcode"></i></button>
                <button class="icon-btn" id="addBtn"><i class="fas fa-plus"></i></button>
            </div>
        </div>
        <div class="stats-row">
            <div class="stat-item"><div class="num" id="totalItems">0</div><div class="label">物品总数</div></div>
            <div class="stat-item"><div class="num" id="totalStock">0</div><div class="label">总库存数量</div></div>
            <div class="stat-item"><div class="num" id="warnCount">0</div><div class="label">库存预警</div></div>
        </div>
    </div>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="搜索工具、备件、物资名称..">
    </div>

    <!-- 页面容器 -->
    <div class="page-container">
        <div class="page active" id="page-home"><div id="homeList"></div></div>
        <div class="page" id="page-list"><div id="listContent"></div></div>
        <div class="page" id="page-records">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <span style="font-weight:600;font-size:16px;">📋 历史流水</span>
                <button class="btn-secondary" style="padding:4px 14px;border:none;border-radius:20px;font-size:12px;cursor:pointer;" id="clearRecordsBtn">清空记录</button>
            </div>
            <div id="recordsList"></div>
        </div>
        <div class="page" id="page-my">
            <div class="my-profile">
                <div class="avatar"><i class="fas fa-user"></i></div>
                <div class="name">物资管理员</div>
                <div class="version">智能物品管理 v3.1</div>
            </div>
            <div class="my-stats">
                <div class="box"><div class="num" id="myTotalItems">0</div><div class="label">物品总数</div></div>
                <div class="box"><div class="num" id="myTotalStock">0</div><div class="label">总库存</div></div>
                <div class="box"><div class="num" id="myRecordsCount">0</div><div class="label">操作记录</div></div>
            </div>
            <div class="my-actions">
                <button id="myExportBtn"><i class="fas fa-file-excel"></i> 导出 Excel 台账</button>
                <button id="myResetBtn" style="color:#dc2626;"><i class="fas fa-trash-alt" style="color:#dc2626;"></i> 重置所有数据</button>
            </div>
            <div style="text-align:center;color:#94a3b8;font-size:12px;margin-top:20px;">数据保存在本地浏览器，无服务器</div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <button class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>首页</span></button>
        <button class="nav-item" data-page="list"><i class="fas fa-th-list"></i><span>物品清单</span></button>
        <button class="nav-item" data-page="records"><i class="fas fa-history"></i><span>出入库</span></button>
        <button class="nav-item" data-page="my"><i class="fas fa-user"></i><span>我的</span></button>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal-mask" id="formModal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div class="modal-title" id="formTitle">新增物品</div>
            <div class="modal-field"><label>物品名称 *</label><input type="text" id="f_name" placeholder="例如：三爪自定心卡盘"></div>
            <div class="modal-field"><label>分类</label><select id="f_category"><option value="刀具">刀具</option><option value="量具">量具</option><option value="备件">备件</option><option value="工装">工装</option><option value="辅料">辅料</option></select></div>
            <div class="modal-field"><label>库存数量</label><input type="number" id="f_qty" value="1" min="0"></div>
            <div class="modal-field"><label>存放位置 / 备注</label><input type="text" id="f_location" placeholder="例如：机加工1号货架"></div>
            <div class="modal-field" style="display:none;" id="editIdField"><label>ID</label><input type="text" id="f_editId" readonly></div>
            <div class="modal-actions"><button class="btn-secondary" id="formCancel">取消</button><button class="btn-primary" id="formSubmit">保存</button></div>
        </div>
    </div>

    <!-- 详情弹窗（含数量输入框） -->
    <div class="modal-mask" id="detailModal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div class="modal-title" id="detailTitle">物品详情</div>
            <div id="detailContent">
                <div class="detail-row"><span class="label">名称</span><span id="d_name">-</span></div>
                <div class="detail-row"><span class="label">分类</span><span id="d_category">-</span></div>
                <div class="detail-row"><span class="label">库存</span><span id="d_qty">-</span></div>
                <div class="detail-row"><span class="label">位置/备注</span><span id="d_location">-</span></div>
                <div class="detail-row"><span class="label">最近更新</span><span id="d_update">-</span></div>
            </div>

            <!-- 数量输入框 -->
            <div style="display:flex;align-items:center;gap:12px;margin:12px 0 8px;padding:8px 0;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;">
                <span style="font-weight:500;font-size:14px;color:#475569;">操作数量</span>
                <div class="qty-input-group">
                    <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#64748b;padding:0 4px;" id="qtyDec">−</button>
                    <input type="number" id="detailQtyInput" value="1" min="1" max="9999">
                    <button style="background:none;border:none;font-size:20px;cursor:pointer;color:#64748b;padding:0 4px;" id="qtyInc">+</button>
                </div>
            </div>

            <div class="detail-actions">
                <button class="btn-success" id="detailIn">📥 入库</button>
                <button class="btn-warning" id="detailOut">📤 出库</button>
                <button class="btn-primary" id="detailEdit">✏️ 编辑</button>
                <button class="btn-danger" id="detailDelete">🗑 删除</button>
            </div>
            <div style="margin-top:12px;font-size:13px;color:#64748b;text-align:center;" id="detailRecord">最近操作：无</div>
        </div>
    </div>

    <!-- 扫码弹窗 -->
    <div class="modal-mask" id="scanModal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div class="modal-title"><i class="fas fa-qrcode"></i> 扫码识别</div>
            <div id="scanner-container"><video id="video" autoplay playsinline></video></div>
            <div class="scanner-tip" id="scanResult">将二维码对准摄像头</div>
            <div class="modal-actions"><button class="btn-secondary" id="scanCancel">取消</button><button class="btn-primary" id="scanRetry">重新识别</button></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  数据层
        // ============================================================
        let inventory = [];
        let records = [];
        let currentDetailId = null;
        let isEditing = false;
        let editingId = null;
        let scanStream = null;
        let scanActive = false;

        const catIcon = { '刀具': 'fa-cut', '量具': 'fa-ruler', '备件': 'fa-cogs', '工装': 'fa-tools', '辅料': 'fa-boxes' };
        const catColor = { '刀具': '#4361ee', '量具': '#10b981', '备件': '#f8961e', '工装': '#8b5cf6', '辅料': '#ec4899' };

        function loadData() {
            const raw = localStorage.getItem('inventory_data');
            if (raw) { try { inventory = JSON.parse(raw); } catch (e) { inventory = []; } } else {
                inventory = [
                    { id: '1', name: '三爪自定心卡盘', category: '备件', qty: 3, location: '机加工1号货架',
                    update: '2026-07-24' },
                    { id: '2', name: '硬质合金车刀', category: '刀具', qty: 12, location: '刀具柜A区',
                    update: '2026-07-24' },
                    { id: '3', name: '游标卡尺 0-150mm', category: '量具', qty: 5, location: '量具室B架',
                    update: '2026-07-23' },
                    { id: '4', name: '铣刀盘 Φ80', category: '刀具', qty: 2, location: '刀具柜C区',
                    update: '2026-07-22' },
                    { id: '5', name: '内六角扳手组套', category: '工装', qty: 8, location: '工具车第二层',
                    update: '2026-07-21' },
                ];
                saveData();
            }
            inventory.forEach(item => { if (!item.location) item.location = ''; });

            const recRaw = localStorage.getItem('records_data');
            if (recRaw) { try { records = JSON.parse(recRaw); } catch (e) { records = []; } } else { records = []; }
        }

        function saveData() {
            localStorage.setItem('inventory_data', JSON.stringify(inventory));
            localStorage.setItem('records_data', JSON.stringify(records));
        }

        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        // ============================================================
        //  记录合并逻辑：同一个物品 + 同一种操作（入库/出库）合并为一条
        // ============================================================
        function addRecord(itemName, action, delta) {
            // 查找是否已有该物品+该操作的记录（最近24小时内，避免跨天合并混乱）
            const now = new Date();
            const today = now.toISOString().slice(0, 10);
            const existing = records.find(r =>
                r.name === itemName &&
                r.action === action &&
                r.date === today
            );
            if (existing) {
                // 合并：累加数量，更新时间
                existing.delta += delta;
                existing.time = now.toISOString().slice(0, 16).replace('T', ' ');
            } else {
                // 新增记录
                records.unshift({
                    id: genId(),
                    name: itemName,
                    action: action,
                    delta: delta,
                    date: today,
                    time: now.toISOString().slice(0, 16).replace('T', ' ')
                });
            }
            // 限制记录总数
            if (records.length > 300) records = records.slice(0, 300);
            saveData();
        }

        // ============================================================
        //  渲染：首页 & 清单 & 记录 & 我的
        // ============================================================
        function renderHome(filter = '') {
            const container = document.getElementById('homeList');
            let list = inventory;
            if (filter.trim()) {
                const kw = filter.trim().toLowerCase();
                list = inventory.filter(item => item.name.includes(kw) || item.category.includes(kw) || (item.location && item
                    .location.includes(kw)));
            }
            list.sort((a, b) => (b.update || '').localeCompare(a.update || ''));
            if (list.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>暂无物品，点击 + 添加</p></div>`;
                updateStats();
                return;
            }
            let html = '';
            list.forEach(item => {
                const icon = catIcon[item.category] || 'fa-cube';
                const color = catColor[item.category] || '#4361ee';
                const low = item.qty <= 3;
                html += `
                    <div class="item-card" data-id="${item.id}">
                        <div class="item-icon" style="background:${color}20;color:${color}"><i class="fas ${icon}"></i></div>
                        <div class="item-info">
                            <div class="name">${item.name}<span class="tag">${item.category||'未分类'}</span>${low?'<span class="badge-warn">⚠️ 预警</span>':''}</div>
                            <div class="desc">${item.location||'无位置信息'}</div>
                            <div class="meta"><span>库存：<span class="qty ${low?'low':''}">${item.qty}</span> 件</span><span>更新：${item.update||'--'}</span></div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.querySelectorAll('#homeList .item-card').forEach(el => {
                el.addEventListener('click', function() { showDetail(this.dataset.id); });
            });
            updateStats();
        }

        function renderListPage() {
            const container = document.getElementById('listContent');
            if (inventory.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>暂无物品</p></div>`;
                return;
            }
            let html = '';
            inventory.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
                const low = item.qty <= 3;
                html += `
                    <div class="item-card" data-id="${item.id}" style="padding:10px 14px;">
                        <div class="item-info" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                            <div><strong>${item.name}</strong> <span class="tag">${item.category||'未分类'}</span></div>
                            <div><span class="qty ${low?'low':''}">${item.qty}</span> 件 ${low?'⚠️':''}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.querySelectorAll('#listContent .item-card').forEach(el => {
                el.addEventListener('click', function() { showDetail(this.dataset.id); });
            });
        }

        function renderRecords() {
            const container = document.getElementById('recordsList');
            if (records.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-clock"></i><p>暂无操作记录</p></div>`;
                return;
            }
            let html = '';
            records.slice(0, 100).forEach(r => {
                const cls = r.action === '入库' ? 'badge-in' : 'badge-out';
                const sign = r.action === '入库' ? '+' : '-';
                html += `
                    <div class="record-item">
                        <div class="info"><span class="name">${r.name}</span><span class="time">${r.time}</span></div>
                        <div><span class="${cls}">${r.action} ${sign}${r.delta}</span></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderMyPage() {
            document.getElementById('myTotalItems').textContent = inventory.length;
            const total = inventory.reduce((s, i) => s + (Number(i.qty) || 0), 0);
            document.getElementById('myTotalStock').textContent = total;
            document.getElementById('myRecordsCount').textContent = records.length;
        }

        function updateStats() {
            document.getElementById('totalItems').textContent = inventory.length;
            const total = inventory.reduce((s, i) => s + (Number(i.qty) || 0), 0);
            document.getElementById('totalStock').textContent = total;
            document.getElementById('warnCount').textContent = inventory.filter(i => (Number(i.qty) || 0) <= 3).length;
        }

        function refreshAll() {
            const filter = document.getElementById('searchInput').value;
            renderHome(filter);
            renderListPage();
            renderRecords();
            renderMyPage();
            updateStats();
        }

        // ============================================================
        //  页面切换
        // ============================================================
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page-' + pageId);
            if (target) target.classList.add('active');
            document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
            document.querySelector(`.bottom-nav .nav-item[data-page="${pageId}"]`)?.classList.add('active');
            if (pageId === 'home') renderHome(document.getElementById('searchInput').value);
            else if (pageId === 'list') renderListPage();
            else if (pageId === 'records') renderRecords();
            else if (pageId === 'my') renderMyPage();
        }

        // ============================================================
        //  弹窗控制
        // ============================================================
        function openModal(id) { document.getElementById(id).classList.add('show'); }

        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        // ============================================================
        //  新增/编辑
        // ============================================================
        function openForm(item = null) {
            if (item) {
                isEditing = true;
                editingId = item.id;
                document.getElementById('formTitle').textContent = '编辑物品';
                document.getElementById('f_name').value = item.name || '';
                document.getElementById('f_category').value = item.category || '刀具';
                document.getElementById('f_qty').value = item.qty || 0;
                document.getElementById('f_location').value = item.location || '';
                document.getElementById('f_editId').value = item.id;
                document.getElementById('editIdField').style.display = 'block';
            } else {
                isEditing = false;
                editingId = null;
                document.getElementById('formTitle').textContent = '新增物品';
                document.getElementById('f_name').value = '';
                document.getElementById('f_category').value = '刀具';
                document.getElementById('f_qty').value = 1;
                document.getElementById('f_location').value = '';
                document.getElementById('f_editId').value = '';
                document.getElementById('editIdField').style.display = 'none';
            }
            openModal('formModal');
        }

        function submitForm() {
            const name = document.getElementById('f_name').value.trim();
            const category = document.getElementById('f_category').value;
            const qty = parseInt(document.getElementById('f_qty').value) || 0;
            const location = document.getElementById('f_location').value.trim();
            if (!name) { alert('请输入物品名称'); return; }
            if (isEditing && editingId) {
                const idx = inventory.findIndex(i => i.id === editingId);
                if (idx !== -1) {
                    inventory[idx].name = name;
                    inventory[idx].category = category;
                    inventory[idx].qty = qty;
                    inventory[idx].location = location;
                    inventory[idx].update = new Date().toISOString().slice(0, 10);
                    saveData();
                    refreshAll();
                }
            } else {
                const newItem = { id: genId(), name, category, qty, location, update: new Date().toISOString().slice(0,
                    10) };
                inventory.push(newItem);
                saveData();
                refreshAll();
            }
            closeModal('formModal');
        }

        // ============================================================
        //  详情（带数量输入）
        // ============================================================
        let detailItem = null;

        function showDetail(id) {
            const item = inventory.find(i => i.id === id);
            if (!item) return;
            detailItem = item;
            currentDetailId = id;
            document.getElementById('d_name').textContent = item.name;
            document.getElementById('d_category').textContent = item.category || '未分类';
            document.getElementById('d_qty').textContent = item.qty + ' 件' + (item.qty <= 3 ? ' ⚠️预警' : '');
            document.getElementById('d_location').textContent = item.location || '未设置';
            document.getElementById('d_update').textContent = item.update || '--';
            document.getElementById('detailTitle').textContent = '📦 ' + item.name;
            document.getElementById('detailRecord').textContent = '最近操作：无';
            document.getElementById('detailQtyInput').value = 1;
            openModal('detailModal');
        }

        // 出入库（使用输入框的数量）
        function changeQtyWithInput(deltaSign) {
            if (!detailItem) return;
            const input = document.getElementById('detailQtyInput');
            let qty = parseInt(input.value) || 1;
            if (qty < 1) qty = 1;
            const delta = deltaSign * qty;
            const newQty = (Number(detailItem.qty) || 0) + delta;
            if (newQty < 0) { alert('库存不足，不能出库'); return; }
            const oldQty = detailItem.qty;
            detailItem.qty = newQty;
            detailItem.update = new Date().toISOString().slice(0, 10);
            const action = delta > 0 ? '入库' : '出库';
            addRecord(detailItem.name, action, Math.abs(delta));
            saveData();
            showDetail(detailItem.id);
            refreshAll();
        }

        function deleteItem(id) {
            if (!confirm('确认删除此物品？')) return;
            inventory = inventory.filter(i => i.id !== id);
            saveData();
            closeModal('detailModal');
            refreshAll();
        }

        // ============================================================
        //  扫码
        // ============================================================
        async function startScanner() {
            const video = document.getElementById('video');
            try {
                scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = scanStream;
                await video.play();
                scanActive = true;
                document.getElementById('scanResult').textContent = '扫描中...';
                requestAnimationFrame(scanLoop);
            } catch (e) {
                alert('无法打开摄像头: ' + e.message + '\n请确保已授予摄像头权限');
            }
        }

        function scanLoop() {
            if (!scanActive) return;
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) {
                scanActive = false;
                document.getElementById('scanResult').textContent = '✅ 识别成功: ' + code.data;
                const kw = code.data.trim();
                const found = inventory.filter(i => i.name.includes(kw) || i.id === kw);
                if (found.length > 0) {
                    alert('找到物品: ' + found[0].name);
                    closeModal('scanModal');
                    showDetail(found[0].id);
                } else {
                    if (confirm('未找到物品 "' + kw + '"，是否新增？')) {
                        closeModal('scanModal');
                        document.getElementById('f_name').value = kw;
                        openForm(null);
                    }
                }
                stopScanner();
                return;
            }
            requestAnimationFrame(scanLoop);
        }

        function stopScanner() {
            scanActive = false;
            if (scanStream) { scanStream.getTracks().forEach(t => t.stop());
                scanStream = null; }
            const video = document.getElementById('video');
            video.srcObject = null;
        }

        // ============================================================
        //  Excel 导出
        // ============================================================
        function exportExcel() {
            if (inventory.length === 0) { alert('暂无数据可导出'); return; }
            const data = inventory.map(item => ({
                'ID': item.id,
                '名称': item.name,
                '分类': item.category,
                '库存数量': item.qty,
                '存放位置': item.location || '',
                '最近更新': item.update || ''
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '台账');
            XLSX.writeFile(wb, `物品台账_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            refreshAll();

            // 全屏兜底
            const el = document.documentElement;
            if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); } else if (el.webkitRequestFullscreen) { el
                    .webkitRequestFullscreen(); }

            document.getElementById('searchInput').addEventListener('input', function() {
                const activePage = document.querySelector('.page.active');
                if (activePage && activePage.id === 'page-home') { renderHome(this.value); }
            });

            document.getElementById('menuToggle').addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebarOverlay').classList.toggle('show');
            });
            document.getElementById('sidebarOverlay').addEventListener('click', function() {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('show');
            });

            document.getElementById('addBtn').addEventListener('click', function() { openForm(null); });

            document.getElementById('formCancel').addEventListener('click', function() { closeModal('formModal'); });
            document.getElementById('formSubmit').addEventListener('click', submitForm);

            // 详情按钮
            document.getElementById('detailEdit').addEventListener('click', function() {
                if (detailItem) { closeModal('detailModal');
                    openForm(detailItem); }
            });
            document.getElementById('detailIn').addEventListener('click', function() { changeQtyWithInput(1); });
            document.getElementById('detailOut').addEventListener('click', function() { changeQtyWithInput(-1); });
            document.getElementById('detailDelete').addEventListener('click', function() {
                if (detailItem) deleteItem(detailItem.id);
            });

            // 数量加减按钮
            document.getElementById('qtyDec').addEventListener('click', function() {
                const input = document.getElementById('detailQtyInput');
                let v = parseInt(input.value) || 1;
                if (v > 1) { v--;
                    input.value = v; }
            });
            document.getElementById('qtyInc').addEventListener('click', function() {
                const input = document.getElementById('detailQtyInput');
                let v = parseInt(input.value) || 1;
                v++;
                input.value = v;
            });

            // 扫码
            document.getElementById('scanBtn').addEventListener('click', function() {
                openModal('scanModal');
                startScanner();
            });
            document.getElementById('scanCancel').addEventListener('click', function() {
                stopScanner();
                closeModal('scanModal');
            });
            document.getElementById('scanRetry').addEventListener('click', function() {
                stopScanner();
                startScanner();
            });

            // 底部导航
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => {
                el.addEventListener('click', function() { switchPage(this.dataset.page); });
            });

            // 侧栏
            document.querySelectorAll('.sidebar-menu .item[data-tab]').forEach(el => {
                el.addEventListener('click', function() {
                    const tab = this.dataset.tab;
                    if (tab === 'home' || tab === 'list' || tab === 'records') { switchPage(tab); }
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('show');
                });
            });

            document.getElementById('exportExcel').addEventListener('click', function() {
                exportExcel();
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('show');
            });

            document.getElementById('clearAllData').addEventListener('click', function() {
                if (confirm('⚠️ 确认删除所有物品数据？此操作不可恢复！')) {
                    inventory = [];
                    saveData();
                    refreshAll();
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('show');
                }
            });

            document.getElementById('myExportBtn').addEventListener('click', exportExcel);
            document.getElementById('myResetBtn').addEventListener('click', function() {
                if (confirm('⚠️ 确认重置所有数据（物品+记录）？')) {
                    inventory = [];
                    records = [];
                    saveData();
                    refreshAll();
                }
            });
            document.getElementById('clearRecordsBtn').addEventListener('click', function() {
                if (confirm('确认清空所有操作记录？')) {
                    records = [];
                    saveData();
                    renderRecords();
                }
            });

            document.querySelectorAll('.modal-mask').forEach(mask => {
                mask.addEventListener('click', function(e) {
                    if (e.target === this) {
                        if (this.id === 'scanModal') stopScanner();
                        this.classList.remove('show');
                    }
                });
            });

            switchPage('home');
        });

        window.addEventListener('beforeunload', function() { stopScanner(); });
    </script>
</body>
</html>
