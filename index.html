<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>出师表 · IP标注工具</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f1f5f9;
            padding: 24px 16px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 28px 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 26px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: #0b1e33;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 14px;
        }
        .sub-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 18px 0;
            font-size: 14px;
            color: #2c3e50;
            gap: 10px;
        }
        .badge {
            background: #eef2f6;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }
        .drop-zone {
            border: 2px dashed #b9c7d9;
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
            background: #fafcff;
            transition: 0.2s;
            cursor: pointer;
            margin-bottom: 18px;
        }
        .drop-zone.drag-over {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: inset 0 0 0 3px rgba(37,99,235,0.12);
        }
        .drop-zone .hint { font-weight: 500; color: #1e2b3c; }
        .drop-zone .sub-hint { font-size: 13px; color: #5b6f87; }
        .row-2col {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin: 12px 0 16px;
        }
        .col {
            flex: 1 1 280px;
            min-width: 220px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            color: #1e2f41;
        }
        textarea {
            width: 100%;
            padding: 12px 14px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 13px;
            border: 1px solid #d0d8e3;
            border-radius: 14px;
            background: #fafcff;
            resize: vertical;
            line-height: 1.6;
            transition: 0.15s;
        }
        textarea:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 1px;
            border-color: transparent;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 8px 0 16px;
            align-items: center;
        }
        .btn {
            background: #f1f4f8;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
            color: #1a2637;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }
        .btn-primary { background: #1f4f8b; color: white; box-shadow: 0 2px 6px rgba(31,79,139,0.2); }
        .btn-primary:hover { background: #1a3f6e; transform: translateY(-1px); }
        .btn-success { background: #1d7a3e; color: white; }
        .btn-success:hover { background: #166332; }
        .btn-outline { background: transparent; border-color: #cad2de; }
        .btn-outline:hover { background: #f1f4f8; }
        .btn-sm { padding: 5px 14px; font-size: 13px; }
        .url-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            background: #f6f9fc;
            padding: 6px 14px 6px 18px;
            border-radius: 40px;
            border: 1px solid #dbe1ea;
        }
        .url-group input {
            border: none;
            background: transparent;
            padding: 6px 0;
            min-width: 200px;
            font-size: 13px;
            outline: none;
            flex: 1 1 180px;
            color: #0a1a2b;
        }
        .url-group input::placeholder { color: #8a9cb0; }
        .result-area {
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .result-area textarea {
            background: #f8fafc;
            color: #0c1a2b;
            min-height: 160px;
        }
        .status-msg {
            font-size: 14px;
            color: #2c4c6e;
            padding: 4px 0;
        }
        .status-msg.success { color: #1a7540; }
        .status-msg.warning { color: #b45309; }
        .flex-grow { flex: 1; }
        @media (max-width: 640px) {
            .container { padding: 16px; }
            .row-2col { flex-direction: column; gap: 12px; }
            .url-group { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📜 出师表 · IP标注</h1>
    <div class="sub-bar">
        <span>按顺序分配《出师表》片段 · 超出则保留原样</span>
        <span class="badge" id="countDisplay">IP: 0 | 诗词: 0</span>
    </div>

    <!-- 拖放区 -->
    <div class="drop-zone" id="dropZone">
        <div class="hint">📂 拖放 .txt 文件到此处 · 自动识别IP或诗词</div>
        <div class="sub-hint">点击也可选择文件</div>
    </div>

    <!-- 网址读取栏 -->
    <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center;">
        <div class="url-group">
            <span style="font-weight: 500; color: #1f3a57;">🌐 从URL读取</span>
            <input type="text" id="urlInput" placeholder="输入 .txt 文件网址" value="https://raw.githubusercontent.com/your/repo/example.txt" />
            <button class="btn btn-primary btn-sm" id="fetchUrlBtn">加载</button>
        </div>
        <span style="font-size: 13px; color: #5a6f87;">支持 IP列表 或 诗词片段</span>
    </div>

    <!-- 双栏输入 -->
    <div class="row-2col">
        <div class="col">
            <label for="poemInput">📖 出师表片段（每行一个）</label>
            <textarea id="poemInput" rows="9" spellcheck="false">臣亮言
先帝创业未半而中道崩殂
今天下三分
益州疲弊
此诚危急存亡之秋也
然侍卫之臣不懈于内
忠志之士忘身于外者
盖追先帝之殊遇
欲报之于陛下也
诚宜开张圣听
以光先帝遗德
恢弘志士之气
不宜妄自菲薄
引喻失义
以塞忠谏之路也
宫中府中
俱为一体
陟罚臧否
不宜异同
若有作奸犯科及为忠善者
宜付有司
论其刑赏
以昭陛下平明之理
不宜偏私
使内外异法也
侍中侍郎郭攸之
费祎
董允等
此皆良实
志虑忠纯
是以先帝简拔以遗陛下
愚以为宫中之事
事无大小
悉以咨之
然后施行
必能裨补阙漏
有所广益
将军向宠
性行淑均
晓畅军事
试用于昔日
先帝称之曰能
是以众议举宠为督
愚以为营中之事
悉以咨之
必能使行阵和睦
优劣得所
亲贤臣
远小人
此先汉所以兴隆也
亲小人
远贤臣
此后汉所以倾颓也
先帝在时
每与臣论此事
未尝不叹息痛恨于桓灵也
侍中
尚书
长史
参军
此悉贞良死节之臣
愿陛下亲之信之
则汉室之隆
可计日而待也
臣本布衣
躬耕于南阳
苟全性命于乱世
不求闻达于诸侯
先帝不以臣卑鄙
猥自枉屈
三顾臣于草庐之中
咨臣以当世之事
由是感激
遂许先帝以驱驰
后值倾覆
受任于败军之际
奉命于危难之间
尔来二十有一年矣
先帝知臣谨慎
故临崩寄臣以大事也
受命以来
夙夜忧叹
恐托付不效
以伤先帝之明
故五月渡泸
深入不毛
今南方已定
兵甲已足
当奖率三军
北定中原
庶竭驽钝
攘除奸凶
兴复汉室
还于旧都
此臣所以报先帝而忠陛下之职分也
至于斟酌损益
进尽忠言
则攸之
祎
允之任也
愿陛下托臣以讨贼兴复之效
不效
则治臣之罪
以告先帝之灵
若无兴德之言
则责攸之
祎
允等之慢
以彰其咎
陛下亦宜自谋
以咨诹善道
察纳雅言
深追先帝遗诏
臣不胜受恩感激
今当远离
临表涕零
不知所言</textarea>
        </div>
        <div class="col">
            <label for="ipInput">🌐 IP列表（格式：IP:端口#标签）</label>
            <textarea id="ipInput" rows="9" spellcheck="false">101.32.41.107:443#HK_1 [超哥优选]
166.88.7.117:443#MY_1 [超哥优选]
198.176.52.248:10123#NRT
162.159.25.26:443#新加坡
172.64.50.38:8443#日本</textarea>
        </div>
    </div>

    <!-- 按钮组 -->
    <div class="toolbar">
        <button class="btn btn-primary" id="processBtn">▶ 处理</button>
        <button class="btn btn-success" id="exportBtn">📥 导出TXT</button>
        <button class="btn btn-outline" id="copyBtn">📋 复制结果</button>
        <button class="btn btn-outline" id="clearBtn">🗑️ 清空结果</button>
        <span class="flex-grow"></span>
        <span class="status-msg" id="statusMsg">就绪</span>
    </div>

    <!-- 输出区域 -->
    <div class="result-area">
        <label>📄 输出结果（# 后已替换）</label>
        <textarea id="resultOutput" rows="10" readonly></textarea>
    </div>
</div>

<script>
    (function() {
        const poemInput = document.getElementById('poemInput');
        const ipInput = document.getElementById('ipInput');
        const resultOutput = document.getElementById('resultOutput');
        const statusMsg = document.getElementById('statusMsg');
        const countDisplay = document.getElementById('countDisplay');
        const dropZone = document.getElementById('dropZone');
        const urlInput = document.getElementById('urlInput');
        const fetchUrlBtn = document.getElementById('fetchUrlBtn');

        // 更新计数
        function updateCounts() {
            const poems = poemInput.value.split('\n').filter(l => l.trim() !== '');
            const ips = ipInput.value.split('\n').filter(l => l.trim() !== '');
            countDisplay.textContent = `IP: ${ips.length} | 诗词: ${poems.length}`;
        }

        // 核心处理
        function processIPs() {
            const poemLines = poemInput.value.split('\n').map(l => l.trim()).filter(l => l !== '');
            const ipLines = ipInput.value.split('\n').map(l => l.trim()).filter(l => l !== '');

            if (poemLines.length === 0) {
                statusMsg.textContent = '⚠️ 请至少输入一行诗词片段';
                statusMsg.className = 'status-msg warning';
                return;
            }
            if (ipLines.length === 0) {
                statusMsg.textContent = '⚠️ 请至少输入一个 IP';
                statusMsg.className = 'status-msg warning';
                return;
            }

            const usedCount = Math.min(poemLines.length, ipLines.length);
            const result = [];

            for (let i = 0; i < ipLines.length; i++) {
                const line = ipLines[i];
                const hashPos = line.indexOf('#');
                let ipPart = line;
                if (hashPos !== -1) {
                    ipPart = line.substring(0, hashPos);
                }
                if (i < usedCount) {
                    result.push(ipPart + '#' + poemLines[i]);
                } else {
                    result.push(line);
                }
            }

            resultOutput.value = result.join('\n');
            statusMsg.textContent = `✅ 处理完成！共 ${ipLines.length} 个 IP，使用了 ${usedCount} 个诗词片段（${ipLines.length > usedCount ? '剩余 ' + (ipLines.length - usedCount) + ' 个保持原样' : '全部替换'}）`;
            statusMsg.className = 'status-msg success';
            updateCounts();
        }

        // 导出TXT
        function exportTXT() {
            const content = resultOutput.value;
            if (!content.trim()) {
                statusMsg.textContent = '⚠️ 没有内容可导出';
                statusMsg.className = 'status-msg warning';
                return;
            }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ip_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            statusMsg.textContent = '📥 导出成功';
            statusMsg.className = 'status-msg success';
        }

        function copyResult() {
            const content = resultOutput.value;
            if (!content.trim()) {
                statusMsg.textContent = '⚠️ 没有内容可复制';
                statusMsg.className = 'status-msg warning';
                return;
            }
            navigator.clipboard.writeText(content).then(() => {
                statusMsg.textContent = '📋 已复制到剪贴板';
                statusMsg.className = 'status-msg success';
            }).catch(() => {
                resultOutput.select();
                document.execCommand('copy');
                statusMsg.textContent = '📋 已复制到剪贴板';
                statusMsg.className = 'status-msg success';
            });
        }

        function clearResult() {
            resultOutput.value = '';
            statusMsg.textContent = '已清空结果';
            statusMsg.className = 'status-msg';
            updateCounts();
        }

        // ------ 从URL加载TXT ------
        function loadFromUrl(url) {
            if (!url || url.trim() === '') {
                statusMsg.textContent = '⚠️ 请输入有效的网址';
                statusMsg.className = 'status-msg warning';
                return;
            }
            statusMsg.textContent = '⏳ 正在加载...';
            statusMsg.className = 'status-msg';
            fetch(url, { cache: 'no-cache' })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);
                    return res.text();
                })
                .then(text => {
                    const lines = text.split('\n').filter(l => l.trim() !== '');
                    if (lines.length === 0) {
                        statusMsg.textContent = '⚠️ 文件为空或无有效内容';
                        statusMsg.className = 'status-msg warning';
                        return;
                    }
                    // 判断是IP列表还是诗词列表：包含 # 或 : 且含有数字/IP特征
                    const hasIpPattern = lines.some(l => l.includes('#') || (l.includes(':') && /\d+\.\d+\.\d+\.\d+/.test(l)));
                    if (hasIpPattern) {
                        ipInput.value = text;
                        statusMsg.textContent = `✅ 已从URL加载IP列表 (${lines.length} 行)`;
                    } else {
                        poemInput.value = text;
                        statusMsg.textContent = `✅ 已从URL加载诗词片段 (${lines.length} 行)`;
                    }
                    statusMsg.className = 'status-msg success';
                    updateCounts();
                    // 自动处理
                    processIPs();
                })
                .catch(err => {
                    statusMsg.textContent = `❌ 加载失败: ${err.message}`;
                    statusMsg.className = 'status-msg warning';
                });
        }

        // ------ 拖放逻辑 ------
        function handleDrop(e) {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                const content = ev.target.result;
                const lines = content.split('\n').filter(l => l.trim() !== '');
                if (lines.length === 0) {
                    statusMsg.textContent = '⚠️ 文件为空';
                    statusMsg.className = 'status-msg warning';
                    return;
                }
                const hasIp = lines.some(l => l.includes('#') || (l.includes(':') && /\d+\.\d+\.\d+\.\d+/.test(l)));
                if (hasIp) {
                    ipInput.value = content;
                    statusMsg.textContent = `📂 已加载IP列表 (${lines.length} 行)`;
                } else {
                    poemInput.value = content;
                    statusMsg.textContent = `📂 已加载诗词片段 (${lines.length} 行)`;
                }
                statusMsg.className = 'status-msg success';
                updateCounts();
                processIPs();
            };
            reader.readAsText(file);
        }

        function handleDragOver(e) { e.preventDefault(); dropZone.classList.add('drag-over'); }
        function handleDragLeave(e) { e.preventDefault(); dropZone.classList.remove('drag-over'); }

        dropZone.addEventListener('dragover', handleDragOver);
        dropZone.addEventListener('dragleave', handleDragLeave);
        dropZone.addEventListener('drop', handleDrop);

        // 点击拖放区选择文件
        dropZone.addEventListener('click', function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,.csv,.text';
            input.onchange = (e) => {
                if (!e.target.files[0]) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const content = ev.target.result;
                    const lines = content.split('\n').filter(l => l.trim() !== '');
                    if (lines.length === 0) return;
                    const hasIp = lines.some(l => l.includes('#') || (l.includes(':') && /\d+\.\d+\.\d+\.\d+/.test(l)));
                    if (hasIp) { ipInput.value = content; } else { poemInput.value = content; }
                    statusMsg.textContent = `📂 已加载${hasIp ? 'IP列表' : '诗词'} (${lines.length} 行)`;
                    statusMsg.className = 'status-msg success';
                    updateCounts();
                    processIPs();
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // 按钮绑定
        document.getElementById('processBtn').addEventListener('click', processIPs);
        document.getElementById('exportBtn').addEventListener('click', exportTXT);
        document.getElementById('copyBtn').addEventListener('click', copyResult);
        document.getElementById('clearBtn').addEventListener('click', clearResult);

        // URL加载按钮
        fetchUrlBtn.addEventListener('click', () => {
            loadFromUrl(urlInput.value.trim());
        });
        // 回车触发加载
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loadFromUrl(urlInput.value.trim());
            }
        });

        // 输入更新计数
        poemInput.addEventListener('input', updateCounts);
        ipInput.addEventListener('input', updateCounts);

        // 初始化
        updateCounts();
        setTimeout(processIPs, 120);
    })();
</script>
</body>
</html>
